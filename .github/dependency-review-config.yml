# Policy for actions/dependency-review-action (the delta-only SCA gate).
# Severity >= high with a fix available -> bump instead of suppressing.
# Genuinely unfixable advisories go in allow-ghsas, each with a comment:
#   reason, owner, and a review-by date. Re-review at each entry's date;
#   remove the entry when a fix ships.
fail-on-severity: high

# Entry format: - GHSA-xxxx-xxxx-xxxx  # <reason>; review by YYYY-MM-DD
allow-ghsas:
  # bcprov-jdk18on 1.77 GOST 28147 CTR keystream reuse (critical). Build
  # classpath only: pulled transitively by AGP 8.7.3 via settings.gradle.kts,
  # never ships in the APK, and AGP's signing code does not use the GOST
  # cipher. Fix (bcprov 1.78) arrives with a future AGP bump — remove this
  # entry when AGP updates. Owner: maintainer; review by 2026-10-15.
  - GHSA-574f-3g2m-x479
