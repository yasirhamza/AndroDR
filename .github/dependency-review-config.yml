# Policy for actions/dependency-review-action (the delta-only SCA gate).
# Severity >= high with a fix available -> bump instead of suppressing.
# Genuinely unfixable advisories go in allow-ghsas, each with a comment:
#   reason, owner, and a review-by date. Re-review at each entry's date;
#   remove the entry when a fix ships.
fail-on-severity: high

# Entry format: - GHSA-xxxx-xxxx-xxxx  # <reason>; review by YYYY-MM-DD
allow-ghsas:
  # ============================ BOOTSTRAP BLOCK ============================
  # REMOVE THIS ENTIRE BLOCK in the follow-up PR right after PR #255 merges.
  #
  # The first-ever dependency-review run has no base snapshot on main, so
  # the entire pre-existing tree evaluates as "added" and every standing
  # advisory fires at once. All 18 entries below are the Gradle BUILD
  # CLASSPATH (AGP 8.7.3 toolchain: netty 4.1.93, protobuf, jdom2, jose4j,
  # commons-io, jackson, bcprov) — none ship in the APK, and none are
  # reachable as network services at build time. Enumerated via the
  # dependency-graph compare API on 2026-07-15 (18 distinct crit/high).
  # Once main has its first snapshot (created by this PR's merge push),
  # the gate is delta-only and these suppressions become dead weight —
  # leaving them would permanently blind the gate to any future *app*
  # dependency carrying the same GHSA. Standing-tree handling belongs to
  # Dependabot (see docs/supply-chain.md).
  - GHSA-574f-3g2m-x479  # bcprov 1.77 (critical) — GOST cipher unused by AGP signing
