name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'notes/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build, sign, verify, and generate SBOM only — do not publish a release or attestation'
        type: boolean
        default: false

# No workflow-level permissions: scoped per-job (spec: "per-job token
# scoping") so a future second job doesn't silently inherit release powers.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_dispatch on an arbitrary ref would hand the signing secrets
    # to unreviewed code and mint a legitimate signed+attested release from
    # a branch, bypassing review. Dispatch is therefore main-only; branch
    # testing of this workflow is no longer possible by design.
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write             # gh release create
      actions: read               # poll ci-success
      checks: read                # poll ci-success
      id-token: write             # provenance attestation (OIDC)
      attestations: write         # provenance attestation
      artifact-metadata: write    # used by attest-build-provenance >= v3.2 (registry modes); harmless for file attestations, kept for forward-compat
    env:
      # Dedicated CI release cert (public — printable from any APK signed
      # with it; the Play upload key is never stored in CI). A build signed
      # with any other key must fail.
      EXPECTED_CERT_SHA256: '940f1b9dacd798507fd2290a7f59341a0c72499f79662e576fc02c7a8a7cbc8b'
      APK_PATH: app/build/outputs/apk/release/app-release.apk
      SBOM_PATH: app/build/reports/cyclonedx/bom.json
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Wait for ci-success on this SHA
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const sha = context.sha;
            // 25 min accommodates cold-cache ci.yml runs (Gradle + Android SDK +
            // unit tests + lint + detekt + emulator queue). Serial current runtime
            // is ~5 min warm; cold cache can hit ~8-10 min. 25 leaves slack without
            // burning runner minutes on a wedged CI.
            const timeoutMs = 25 * 60 * 1000;
            const pollMs = 30 * 1000;
            const deadline = Date.now() + timeoutMs;
            core.info(`Polling ci-success for ${sha}`);
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                check_name: 'ci-success',
                filter: 'latest',
              });
              const runs = data.check_runs;
              if (runs.length === 0) {
                core.info('ci-success not reported yet; waiting...');
              } else {
                const run = runs[0];
                core.info(`ci-success status=${run.status} conclusion=${run.conclusion}`);
                if (run.status === 'completed') {
                  if (run.conclusion === 'success') {
                    core.info('ci-success passed; proceeding to build release');
                    return;
                  }
                  core.setFailed(`ci-success concluded '${run.conclusion}'; aborting release`);
                  return;
                }
              }
              await new Promise(r => setTimeout(r, pollMs));
            }
            core.setFailed('Timed out waiting for ci-success');
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.jks"
      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release-keystore.jks
        run: ./gradlew assembleRelease --stacktrace
      - name: Generate CycloneDX SBOM
        run: ./gradlew :app:cyclonedxBom
      - name: Verify APK signature against pinned CI release cert
        run: |
          set -euo pipefail
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK_PATH" | tee /tmp/apksigner.out
          # apksigner's signer-line format varies by build-tools version:
          #   'Signer #1 certificate SHA-256 digest: <hex>'          (older)
          #   'V2 Signer: certificate SHA-256 digest: <hex>'         (newer, per-scheme)
          #   'Signer (minSdkVersion=N) certificate SHA-256 digest:' (v3.1 rotation)
          # Collect the DISTINCT cert digests across all signer lines: one
          # signer signing multiple schemes repeats the same digest; a second
          # signer introduces a different one. 'Source Stamp Signer' lines
          # don't match (they don't start with 'Signer'/'V<n> Signer').
          DIGESTS=$(grep -E '^(Signer|V[0-9.]+ Signer:).* certificate SHA-256 digest:' /tmp/apksigner.out \
            | sed -E 's/.*certificate SHA-256 digest: *//' | tr 'A-F' 'a-f' | sort -u)
          COUNT=$(printf '%s\n' "$DIGESTS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "FAIL: expected exactly 1 distinct signer certificate, found ${COUNT} (0 = unsigned or apksigner output format drift — inspect /tmp/apksigner.out above)" >&2
            exit 1
          fi
          if [ "$DIGESTS" != "$EXPECTED_CERT_SHA256" ]; then
            echo "FAIL: APK is not signed by the expected CI release key" >&2
            exit 1
          fi
          echo "PASS: exactly one signer certificate, matching pinned CI release cert"
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore.jks"
      - name: Compute version and release notes
        id: version
        run: |
          set -euo pipefail
          BASE_VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\([0-9.]*\)\..*/\1/')
          if [ -z "$BASE_VERSION" ]; then
            echo "ERROR: failed to extract BASE_VERSION from app/build.gradle.kts" >&2
            grep 'versionName' app/build.gradle.kts >&2
            exit 1
          fi
          BUILD=$(git rev-list --count HEAD)
          VERSION="${BASE_VERSION}.${BUILD}"
          TAG="v${VERSION}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log -20 --pretty=format:"- %s" --no-merges)
          fi
          printf "## What's Changed\n\n%s\n\n**Full changelog**: https://github.com/%s/compare/%s...%s\n" \
            "$CHANGES" "${{ github.repository }}" "${PREV_TAG:-v0.0.0}" "$TAG" > /tmp/release-notes.md
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (APK + SBOM)
        # Deliberately skipped on dry-runs: attestations are permanent in
        # the repo's attestation log (declared deviation — first real
        # release is the attestation test, verified immediately post-merge).
        if: ${{ inputs.dry_run != true }}
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: |
            ${{ env.APK_PATH }}
            ${{ env.SBOM_PATH }}
      - name: Publish release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2016  # backticks in printf are literal markdown
          {
            cat /tmp/release-notes.md
            printf '\n---\nVerify this release: `gh attestation verify app-release.apk --repo %s`\nSBOM: `bom.json` (CycloneDX). Details: docs/supply-chain.md\n' "${{ github.repository }}"
          } > /tmp/release-notes-full.md
          gh release create "${{ steps.version.outputs.tag }}" \
            "$APK_PATH" \
            "$SBOM_PATH" \
            --target "${{ github.sha }}" \
            --title "AndroDR ${{ steps.version.outputs.tag }}" \
            --notes-file /tmp/release-notes-full.md
      - name: Upload dry-run artifacts
        if: ${{ inputs.dry_run == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run
          path: |
            ${{ env.APK_PATH }}
            ${{ env.SBOM_PATH }}
          retention-days: 7
