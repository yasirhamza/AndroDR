name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Classifies the diff into "code" / "rules" / "python" buckets so downstream
  # jobs can skip themselves on irrelevant changes. Saves GHA minutes on
  # YAML-only and Python-only PRs. secret-scan + submodule-check always run
  # (cheap, catch accidents). ci-success treats `skipped` as a pass.
  # No untrusted input is interpolated into run: scripts in any job below.
  #
  # IMPORTANT: dorny/paths-filter@v3 evaluates each pattern in a filter under
  # "any matches" semantics. A `!pattern` entry is therefore a separate
  # positive matcher meaning "file does NOT match pattern" — it does NOT
  # subtract from earlier positive matches the way .gitignore does. Keep
  # `code` (and any future filter) as a positive allowlist; do not add `!`
  # patterns here. See PR #202's regression for the bug this caused.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      rules: ${{ steps.filter.outputs.rules }}
      python: ${{ steps.filter.outputs.python }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            deps:
              - 'gradle/libs.versions.toml'
              - 'gradle/verification-metadata.xml'
              - 'app/build.gradle.kts'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - '.github/workflows/ci.yml'
              - '.github/dependency-review-config.yml'
              - 'buildSrc/**'
            rules:
              - 'app/src/main/res/raw/sigma_*.yml'
              - 'app/src/main/res/raw/known_oem_prefixes.yml'
            python:
              - 'scripts/**'
            code:
              # Kotlin / Java sources across all source sets
              - 'app/src/**/*.kt'
              - 'app/src/**/*.java'
              # Android XML (manifests, layouts, values, drawable XML, keep.xml)
              - 'app/src/**/*.xml'
              # Non-rule resources under res/raw (rule files match `rules` above)
              - 'app/src/main/res/raw/*.json'
              - 'app/src/main/res/raw/*.txt'
              - 'app/src/main/res/raw/known_spyware_artifacts.yml'
              # Test fixtures and resource bundles
              - 'app/src/test/resources/**'
              - 'app/src/androidTest/resources/**'
              # Build configuration
              - 'app/build.gradle.kts'
              - 'app/proguard-rules.pro'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              # Submodule pointer (rule-schema cross-check tests)
              - 'third-party/android-sigma-rules'
              # CI workflows
              - '.github/workflows/**'
  build-and-test:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.rules == 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build debug APK + run unit tests
        run: ./gradlew assembleDebug test --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: warn
      - name: Upload unit test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: warn
  lint-and-detekt:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Lint + detekt
        run: ./gradlew lintDebug detekt --stacktrace
      - name: Upload lint report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: warn
      - name: Upload detekt report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: detekt-report
          path: app/build/reports/detekt/
          retention-days: 14
          if-no-files-found: warn
  apk-analyze:
    runs-on: ubuntu-latest
    needs: [changes, build-and-test]
    if: ${{ needs.changes.outputs.code == 'true' || needs.changes.outputs.rules == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Download debug APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: app-debug
          path: apk/
      - name: Check manifest for exported components without permission
        run: |
          set -euo pipefail
          APKANALYZER=$(find "$ANDROID_HOME/cmdline-tools" -name apkanalyzer -type f | head -1)
          if [ -z "$APKANALYZER" ]; then
            echo "apkanalyzer not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          APK=apk/app-debug.apk
          MANIFEST=$("$APKANALYZER" manifest print "$APK")
          if echo "$MANIFEST" | grep -qE 'exported="true"' && \
             ! echo "$MANIFEST" | grep -qE 'permission='; then
            echo "FAIL: exported component(s) without permission" >&2
            echo "$MANIFEST"
            exit 1
          fi
          echo "PASS: no exported components without permission"
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          GITLEAKS_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
      - name: Scan for secrets
        run: gitleaks detect --source . --verbose
  submodule-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
      - name: Verify submodule HEAD is reachable from upstream main
        working-directory: third-party/android-sigma-rules
        run: |
          set -euo pipefail
          # actions/checkout@v4 with submodules:true does a shallow clone and
          # does not set up a remote-tracking branch, so we compare against
          # FETCH_HEAD from an explicit unshallow fetch.
          git fetch --unshallow origin main 2>/dev/null \
            || git fetch origin main
          HEAD_SHA=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "$HEAD_SHA" FETCH_HEAD; then
            echo "PASS: submodule HEAD $HEAD_SHA is reachable from upstream main"
          else
            echo "FAIL: submodule HEAD $HEAD_SHA is NOT reachable from upstream main" >&2
            echo "Upstream may have force-pushed, or the submodule points at a dangling commit." >&2
            exit 1
          fi
  tracked-path-denylist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Check no denylisted local-state/sensitive path is tracked
        run: bash .github/scripts/check-tracked-paths.sh
  # Submits the resolved Gradle dependency graph to GitHub. Gradle graphs
  # aren't manifest-parseable, so PR-side submission is what gives
  # dependency-review something to diff. Fork PRs lack contents:write —
  # non-issue on this maintainer-only repo.
  dependency-submission:
    runs-on: ubuntu-latest
    needs: changes
    # Always submit on pushes to main: the compare API needs a snapshot for
    # the EXACT base SHA (no reliable nearest-commit fallback — proven live
    # on PR #260, whose base was a merge that skipped the deps bucket and
    # left dependency-review comparing against nothing). ~90s per merge.
    if: ${{ needs.changes.outputs.deps == 'true' || github.event_name == 'push' }}
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
          # This job holds a contents:write token while resolving the PR
          # branch's Gradle build — keep the token off disk. Residual
          # exposure via the action's env is an accepted trade-off; the
          # fork-safe generate-and-upload/download-and-submit split is the
          # escape hatch if it ever matters.
          persist-credentials: false
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # Graph telemetry only — nothing built here ships. Verification
          # must be off because the action's init script injects the
          # github-dependency-graph plugin, whose artifacts are (by design)
          # not recorded in gradle/verification-metadata.xml once PR 3
          # lands. Harmless before PR 3.
          additional-arguments: --dependency-verification=off
  # Delta-only SCA gate: fails a PR that introduces/bumps a dependency
  # carrying a known Crit/High vuln. Pre-existing tree CVEs are Dependabot's
  # job (fixable -> update PR, unfixable -> Security-tab alert).
  dependency-review:
    runs-on: ubuntu-latest
    needs: [changes, dependency-submission]
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.deps == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          config-file: './.github/dependency-review-config.yml'
          retry-on-snapshot-warnings: true
          # TEMPORARY (remove in the auto-regen follow-up PR): the current
          # main tip (94c8049, a merge that skipped the deps bucket) has no
          # graph snapshot, so the default base compare reports the whole
          # tree as "added". Pin the base to the last snapshot-bearing main
          # commit; the push-rule on dependency-submission above guarantees
          # every FUTURE main tip has a snapshot, after which this override
          # must go (a stale pin would accumulate false deltas).
          base-ref: d0fc8945a9bafe3438c7b6cbf4af5a3974308d4c
          head-ref: ${{ github.event.pull_request.head.sha }}
  python-pipeline:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'
      - name: Install runtime deps for script smoke tests
        # Only pyyaml is needed: merge-ioc-data.py imports yaml at module
        # scope, so --help fails without it. Keep this minimal — the smoke
        # test is meant to exercise argparse, not run the full pipeline.
        run: python3 -m pip install --quiet pyyaml
      - name: Syntax-check tracked Python scripts
        run: |
          set -euo pipefail
          mapfile -t PY_FILES < <(git ls-files 'scripts/*.py')
          if [ ${#PY_FILES[@]} -eq 0 ]; then
            echo "No tracked Python scripts found"
            exit 0
          fi
          python3 -m py_compile "${PY_FILES[@]}"
          echo "PASS: ${#PY_FILES[@]} script(s) compile"
      - name: Smoke-test merge-ioc-data.py arg parsing
        run: python3 scripts/merge-ioc-data.py --help
      - name: Smoke-test generate_known_good_apps.py arg parsing
        run: python3 scripts/generate_known_good_apps.py --help || true
  instrumented:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' }}
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: true
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload instrumented test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected/
          retention-days: 14
          if-no-files-found: warn
  ci-success:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - build-and-test
      - lint-and-detekt
      - apk-analyze
      - secret-scan
      - submodule-check
      - tracked-path-denylist
      - python-pipeline
      - dependency-submission
      - dependency-review
    steps:
      - name: Verify all required gates passed (belt-and-braces)
        run: |
          # `skipped` is a PASS here — the path-filter job intentionally
          # excludes downstream jobs that don't apply (e.g., python-pipeline
          # on a Kotlin-only PR). `failure` and `cancelled` are still fails.
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required gate failed or was cancelled" >&2
            echo "needs.build-and-test.result:   ${{ needs.build-and-test.result }}" >&2
            echo "needs.lint-and-detekt.result:  ${{ needs.lint-and-detekt.result }}" >&2
            echo "needs.apk-analyze.result:      ${{ needs.apk-analyze.result }}" >&2
            echo "needs.secret-scan.result:      ${{ needs.secret-scan.result }}" >&2
            echo "needs.submodule-check.result:  ${{ needs.submodule-check.result }}" >&2
            echo "needs.tracked-path-denylist.result: ${{ needs.tracked-path-denylist.result }}" >&2
            echo "needs.python-pipeline.result:  ${{ needs.python-pipeline.result }}" >&2
            echo "needs.dependency-submission.result: ${{ needs.dependency-submission.result }}" >&2
            echo "needs.dependency-review.result:     ${{ needs.dependency-review.result }}" >&2
            exit 1
          fi
          echo "All required gates passed (or were intentionally skipped by path filter)"
