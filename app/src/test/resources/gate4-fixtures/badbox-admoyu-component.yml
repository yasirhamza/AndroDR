# Fixture for androdr-094: BADBOX/MoYu AdmoyuService component fingerprint.
# The rule has no system-app filter by design — BADBOX ships as preinstalled
# system apps on TV boxes / head units — so a system app WITH the component
# still fires; the true_negatives therefore vary the component, never
# is_system_app.
rule_file: sigma_androdr_094_badbox_admoyu_component.yml
service: app_scanner
true_positives:
  # Exact Kaspersky-reported class on the TV set-top variant
  - package_name: "com.abc.nexus"
    is_system_app: false
    embedded_component_class:
      - "com.moyu.ad.AdmoyuService"
  # Renamed/repackaged variant keeping the internal component name — the
  # whole reason this rule exists on top of the package-name IOCs
  - package_name: "com.repacked.variant"
    is_system_app: true
    embedded_component_class:
      - "io.badbox.core.AdmoyuServiceImpl"
true_negatives:
  # Benign app — no embedded component classes
  - package_name: "com.google.android.gm"
    is_system_app: false
    embedded_component_class: []
  # Cross-isolation: a different broker/malware class must NOT trigger 094
  - package_name: "com.example.outlogicembedder"
    is_system_app: false
    embedded_component_class:
      - "io.xmode.locationsdk.GeoSyncService"
  # Near-miss substring guard: "Admoyu" without "AdmoyuService" must NOT fire
  - package_name: "com.example.nearmiss"
    is_system_app: false
    embedded_component_class:
      - "com.admoyu.analytics.AdmoyuClient"
