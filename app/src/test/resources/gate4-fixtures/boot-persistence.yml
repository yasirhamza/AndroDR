# Fixture for androdr-066 after the #331 sideload gate: the rule moved from
# receiver_audit (fired on ANY non-system boot receiver — six store-installed
# false positives on a clean device) to app_scanner, and fires only when
# has_boot_receiver co-occurs with a sideload signal (#136 Phase 2
# trusted_installer_db store gate, mirroring androdr-010).
rule_file: sigma_androdr_066_boot_persistence.yml
service: app_scanner
ioc_stubs:
  trusted_installer_db:
    - "com.android.vending"
  known_good_app_db:
    - "com.whatsapp"
    - "com.google.android.gms"

true_positives:
  # Sideloaded (no installer) with a boot receiver — the gated detection.
  - package_name: "com.shady.stalkerware"
    installer: null
    has_boot_receiver: true
    is_system_app: false
  # Untrusted install channel with a boot receiver.
  - package_name: "com.shady.persistence"
    installer: "com.evil.sideloader"
    has_boot_receiver: true
    is_system_app: false

true_negatives:
  # The #331 false-positive class: store-installed app with a boot receiver
  # (Amex, AdGuard, MS Family Safety, ... were all this shape) — exempt via
  # the negated trusted_installer_db store gate.
  - package_name: "com.AmexApp"
    installer: "com.android.vending"
    has_boot_receiver: true
    is_system_app: false
  # System app with a boot receiver — filtered by is_system_app.
  - package_name: "com.android.phone"
    installer: null
    has_boot_receiver: true
    is_system_app: true
  # Known-good non-system app — filtered by known_good_app_db.
  - package_name: "com.whatsapp"
    installer: null
    has_boot_receiver: true
    is_system_app: false
  # Sideloaded but no boot receiver — selection does not match.
  - package_name: "com.random.sideload"
    installer: null
    has_boot_receiver: false
    is_system_app: false
  # FLEET SAFETY (#331): a record from an old binary that does not emit
  # has_boot_receiver at all must stay silent — the field appears only in a
  # POSITIVE selection, so its absence no-ops the rule rather than inverting.
  - package_name: "com.old.fleet.sideload"
    installer: null
    is_system_app: false
