# Fixture for androdr-069: sideloaded app with screen overlay permission
#
# Telemetry here MUST mirror what AppScanner actually emits in the
# `permissions` field: short-named permission identifiers (e.g.
# "SYSTEM_ALERT_WINDOW", not "android.permission.SYSTEM_ALERT_WINDOW"), and
# only security-relevant permissions (surveillance + high-risk) — INTERNET and
# other normal permissions are never surfaced. A prior version of this fixture
# fed fully-qualified names the scanner never produces, which let the rule pass
# the test while being dead on-device.
rule_file: sigma_androdr_069_overlay_permission.yml
service: app_scanner
ioc_stubs:
  known_good_app_db:
    - "com.google.android.gm"

true_positives:
  - package_name: "com.shady.bankingoverlay"
    is_system_app: false
    from_trusted_store: false
    is_known_oem_app: false
    permissions:
      - "SYSTEM_ALERT_WINDOW"

true_negatives:
  # System app with the permission — filtered by is_system_app
  - package_name: "com.android.systemui"
    is_system_app: true
    from_trusted_store: false
    is_known_oem_app: false
    permissions:
      - "SYSTEM_ALERT_WINDOW"
  # Trusted-store app with the permission — filtered by from_trusted_store
  - package_name: "com.example.legitimate"
    is_system_app: false
    from_trusted_store: true
    is_known_oem_app: false
    permissions:
      - "SYSTEM_ALERT_WINDOW"
  # Known-good sideloaded app — filtered by known_good_app_db
  - package_name: "com.google.android.gm"
    is_system_app: false
    from_trusted_store: false
    is_known_oem_app: false
    permissions:
      - "SYSTEM_ALERT_WINDOW"
  # Sideloaded app without the overlay permission (only a surveillance perm)
  - package_name: "com.shady.nooverlay"
    is_system_app: false
    from_trusted_store: false
    is_known_oem_app: false
    permissions:
      - "CAMERA"
  # OEM preload — filtered by is_known_oem_app. OEMs that ship preloads off
  # non-/system partitions (OPPO ColorOS) leave FLAG_SYSTEM unset and set no
  # installer package, so is_system_app and from_trusted_store are both false
  # on genuine manufacturer software. Overlay permission is common in preloads.
  - package_name: "com.oplus.member"
    is_system_app: false
    from_trusted_store: false
    is_known_oem_app: true
    permissions:
      - "SYSTEM_ALERT_WINDOW"
