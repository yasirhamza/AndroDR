title: Sideloaded app with system-impersonating name
id: androdr-016
status: production
description: Sideloaded app uses a display name that mimics system components.
author: AndroDR
date: 2026/03/27
tags:
    - attack.t1036.005
logsource:
    product: androdr
    service: app_scanner
detection:
    selection_untrusted:
        is_system_app: false
        is_known_oem_app: false
    store_installed:
        installer|ioc_lookup: trusted_installer_db
    selection_name:
        app_name|contains:
            - System
            - Google
            - Android
            - Samsung
            - Settings
    condition: selection_untrusted and not store_installed and selection_name
level: high
category: incident
display:
    category: app_risk
    icon: masks
    triggered_title: "System Name Disguise"
    evidence_type: none
    guidance: "REVIEW -- disguised as system app but not from manufacturer"
falsepositives:
    - Legitimate developer tools with system-sounding names
remediation:
    - "This app's name impersonates a system component but was installed from an untrusted source."
    - "Uninstall it unless you specifically installed it."
implies_flags:
    - sideloaded
