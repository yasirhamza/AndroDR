version: "2026-05-19"
description: "Known OEM, carrier, and chipset vendor package prefixes. Split into unconditional and device-conditional sections: conditional blocks only apply when the assessed device's manufacturer/brand matches the block's manufacturer_match / brand_match lists. This closes the prefix-spoofing attack from #90 where an attacker could hide malware under a foreign vendor's package namespace on a device that doesn't actually use that vendor."
sources:
  - uad-list
  - plexus-data
  - manual-verification
  - androdr-research

# ============================================================
# UNCONDITIONAL PREFIXES — apply to every device regardless of manufacturer.
# These represent packages that legitimately ship cross-vendor and cannot be
# meaningfully spoofed (either they're signed by Google, or they're chipset
# firmware components that only load if the chipset is present).
# ============================================================
unconditional:
  aosp_prefixes:
    - "com.android."
    - "com.google."
    - "android."

  chipset_prefixes:
    - "com.qualcomm."
    - "com.qti."
    - "vendor.qti."
    - "org.codeaurora."   # Code Aurora Forum — Qualcomm-aligned open-source baseband/IMS namespace (e.g., org.codeaurora.ims)
    - "com.mediatek."
    - "com.mtk."
    - "com.unisoc."
    - "com.sprd."
    - "vendor.unisoc."
    - "vendor.sprd."

  odm_prefixes:
    - "com.bsp."
    - "com.wingtech."
    - "com.longcheer."

  android_go_prefixes:
    - "com.go."

  custom_rom_prefixes:
    - "org.lineageos."
    - "com.cyanogenmod."

  # Partner pre-installs — cross-OEM packages bundled by manufacturers as
  # part of commercial partnerships. Each ships as system: true on the OEM
  # image but its package namespace belongs to the partner, not the OEM,
  # so it falls through OEM-conditional blocks and trips androdr-015
  # (Unrecognized System App, LOW) as a false positive.
  #
  # Treated as unconditional because the signed package is identical
  # across every OEM that ships it (Microsoft, Meta, the SwiftKey APK on
  # Play are the same APK whether preloaded on HONOR, Samsung, OPPO, etc.).
  #
  # Entry-shape rules:
  #   * Trailing dot ("com.X.") only when the partner namespace has no
  #     publicly-distributable apps an attacker could spoof under it.
  #   * Exact-match (no trailing dot) where the partner also publishes
  #     user-installable apps under com.<partner>.* that we do NOT want
  #     implicitly trusted (e.g., com.facebook.katana / com.microsoft.emmx /
  #     com.touchtype.* sibling APKs an attacker could publish).
  #
  # NOT-added intentionally:
  #   * com.aura.*  — IronSource AppCloud sponsored-app installer (different
  #     vendor than the Aura identity-protection brand). The project's own
  #     known_good_apps.json catalogs 5+ com.aura.oobe.* / com.aura.jet.*
  #     packages as "App from <carrier>. Installs apps on oobe and is made
  #     by advertising company 'ironSource'." Existing exclusion comment at
  #     conditional/us_carrier_tmobile (below) is the standing project
  #     stance. Detection of these as Unrecognized System App is intended.
  partner_preinstall_prefixes:
    - "com.touchtype.swiftkey"    # SwiftKey (Microsoft-owned, exact-match — TouchType Ltd. namespace isn't reserved on Play, so a trailing-dot prefix would create a spoofing surface)
    - "com.microsoft.appmanager"  # Microsoft Phone Link / Link to Windows (exact-match; trailing dot covered via Kotlin startsWith semantics for variants like com.microsoft.appmanager.cn)
    - "com.facebook.appmanager"   # Facebook OEM stub appmanager — preinstalled on most non-Google OEM images
    - "com.facebook.services"     # Facebook OEM stub services

  # Trusted app store installer package names. These are compared against
  # installer identity, not against arbitrary package names, so they are
  # safe to keep unconditional.
  trusted_installers:
    - "com.android.vending"             # Google Play Store
    - "com.sec.android.app.samsungapps" # Samsung Galaxy Store
    - "com.samsung.android.app.updatecenter"
    - "com.samsung.android.app.watchmanager"
    - "com.samsung.android.scloud"
    - "com.samsung.android.themestore"
    - "com.samsung.android.spay"
    - "com.sec.android.app.sbrowser"
    - "com.facebook.system"
    - "com.xiaomi.market"
    - "com.xiaomi.mipicks"
    - "com.miui.packageinstaller"
    - "com.heytap.market"
    - "com.coloros.safecenter"
    - "com.huawei.appmarket"
    - "com.bbk.appstore"

# ============================================================
# DEVICE-CONDITIONAL PREFIXES — apply only when the assessed device's
# manufacturer or brand matches the block's manufacturer_match /
# brand_match list. On a device that doesn't match, these prefixes are
# NOT in the applicable set, which means an app using them will be
# classified on its own merits (potentially flagged as sideloaded,
# firmware implant, or system name disguise).
# ============================================================
conditional:

  samsung:
    manufacturer_match: ["samsung"]
    brand_match: ["samsung"]
    strict_prefixes:
      - "com.samsung."
      - "com.sec."
      - "com.osp."
      - "com.knox."
      - "com.skms."
      - "com.mygalaxy."
      - "com.monotype."
      - "com.hiya."
      - "com.sem."
      - "com.swiftkey."
      - "com.shannon."
      - "com.wsomacp"
      - "com.wssyncmldm"
    # partnership_prefixes intentionally omitted. Samsung-bundled partner apps
    # (Microsoft, Netflix, Facebook, Spotify, Booking, LinkedIn, etc.) are
    # classified via the known_good_apps.json database (UAD-ng Oem/Carrier/Misc
    # lists) — a community-maintained data source that scales without requiring
    # AndroDR releases for every new Samsung partner deal. A closed allowlist
    # here produced HIGH "firmware implant" false positives on any un-listed
    # preload; see issue #147.

  xiaomi:
    manufacturer_match: ["xiaomi"]
    brand_match: ["xiaomi", "redmi", "poco"]
    strict_prefixes:
      - "com.miui."
      - "com.xiaomi."
      - "com.mi."
      - "com.duokan."
      - "com.mipay."
      - "android.miui."   # UAD: android.miui.home.launcher.res, android.miui.overlay, android.miui.overlay.telephony, android.miui.poco.launcher.res (4 packages)
      - "eu.xiaomi."   # UAD: eu.xiaomi.ext, eu.xiaomi.module.inject (2 packages)

  motorola:
    manufacturer_match: ["motorola", "lenovo"]
    brand_match: ["motorola", "lenovo"]
    strict_prefixes:
      - "com.motorola."
      - "com.lenovo."   # UAD: com.lenovo.leos.appstore, com.lenovo.leos.cloud.sync, com.lenovo.levoice.caption, com.lenovo.levoice.trigger, com.lenovo.levoice_agent, com.lenovo.levoice_notes, com.lenovo.lsf.user, com.lenovo.ue.device, com.lenovo.weathercenter (9 packages)
      - "com.tblenovo."   # UAD: com.tblenovo.center, com.tblenovo.lenovotips (2 packages)
      - "com.zui."   # UAD: com.zui.android.overlay.common, com.zui.antitheft, com.zui.browser, com.zui.camera, com.zui.contacts, com.zui.launcher, ... (64 packages)

  oneplus:
    manufacturer_match: ["oneplus"]
    brand_match: ["oneplus"]
    strict_prefixes:
      - "com.oneplus."
      - "cn.oneplus."   # UAD: cn.oneplus.nvbackup, cn.oneplus.oem_tcma, cn.oneplus.oemtcma, cn.oneplus.opmms, cn.oneplus.photos (5 packages)
      - "net.oneplus."   # UAD: net.oneplus.commonlogtool, net.oneplus.forums, net.oneplus.launcher, net.oneplus.odm, net.oneplus.push, net.oneplus.weather, ... (14 packages)

  lg:
    manufacturer_match: ["lge"]
    brand_match: ["lge"]
    strict_prefixes:
      - "com.lge."

  htc:
    manufacturer_match: ["htc"]
    brand_match: ["htc"]
    strict_prefixes:
      - "com.htc."

  sony:
    manufacturer_match: ["sony"]
    brand_match: ["sony"]
    strict_prefixes:
      - "com.sony."
      - "com.sonymobile."   # UAD: com.sonymobile.advancedlogging, com.sonymobile.android.contacts, com.sonymobile.assist, com.sonymobile.cameracommon, com.sonymobile.email, com.sonymobile.home.product.res.overlay, com.sonymobile.lifelog, com.sonymobile.music.googlelyricsplugin, com.sonymobile.xperiaservices, ... (68 packages)
      - "com.sonyericsson."   # UAD: com.sonyericsson.album, com.sonyericsson.android.camera, com.sonyericsson.android.conversations, com.sonyericsson.fmradio, com.sonyericsson.home, com.sonyericsson.music, com.sonyericsson.setupwizard, ... (57 packages)

  huawei:
    manufacturer_match: ["huawei", "honor"]
    brand_match: ["huawei", "honor"]
    strict_prefixes:
      - "com.huawei."
      - "com.honor."
      - "com.hihonor."   # UAD: com.hihonor.HnMultiScreenShot, com.hihonor.aipluginengine, com.hihonor.android.launcher, com.hihonor.appmarket, com.hihonor.assistant, com.hihonor.camera, com.hihonor.contacts, com.hihonor.id, com.hihonor.search, com.hihonor.systemmanager, ... (85 packages)

  asus:
    manufacturer_match: ["asus"]
    brand_match: ["asus"]
    strict_prefixes:
      - "com.asus."

  oppo:
    manufacturer_match: ["oppo", "oplus"]
    brand_match: ["oppo"]
    strict_prefixes:
      - "com.oppo."
      - "com.coloros."
      - "com.heytap."
      - "com.oplus."

  realme:
    manufacturer_match: ["realme"]
    brand_match: ["realme"]
    strict_prefixes:
      - "com.realme."

  vivo:
    manufacturer_match: ["vivo"]
    brand_match: ["vivo", "iqoo"]
    strict_prefixes:
      - "com.vivo."
      - "com.bbk."
      - "com.iqoo."   # UAD: com.iqoo.aftersale.engineermode, com.iqoo.engineermode, com.iqoo.powersaving, com.iqoo.secure, com.iqoo.user.engineermode, com.iqoo.website (6 packages)

  amazon:
    manufacturer_match: ["amazon"]
    brand_match: ["amazon"]
    strict_prefixes:
      - "com.amazon."

  transsion:
    manufacturer_match: ["transsion", "tecno", "infinix", "itel"]
    brand_match: ["transsion", "tecno", "infinix", "itel"]
    strict_prefixes:
      - "com.transsion."   # UAD: com.transsion.XOSLauncher, com.transsion.aivoiceassistant, com.transsion.calendar, com.transsion.camera, com.transsion.hilauncher, com.transsion.infinix.xclub, com.transsion.itel.manual, com.transsion.phonemanager, com.transsion.systemupdate, ... (94 packages)
      - "com.infinix."   # UAD: com.infinix, com.infinix.xshare (2 packages)
      - "com.itel."   # UAD: com.itel.TWSService (1 package)
      # com.tecno. intentionally absent: zero packages in UAD's current catalog.
      # Add when the audit script surfaces them.

  nothing:
    manufacturer_match: ["nothing"]
    brand_match: ["nothing"]
    strict_prefixes:
      - "com.nothing."   # UAD: com.nothing.OfflineOTAUpgradeApp, com.nothing.applocker, com.nothing.camera, com.nothing.dirac, com.nothing.glyphnotification, com.nothing.launcher, com.nothing.smartcenter, com.nothing.weather, ... (24 packages)

  zte:
    manufacturer_match: ["zte", "nubia"]
    brand_match: ["zte", "nubia"]
    strict_prefixes:
      - "com.zte."   # UAD: com.zte.assistant, com.zte.contacts.sub, com.zte.easymode, com.zte.faceverify, com.zte.fingerprints, com.zte.mifavor.launcher, com.zte.setupwizard, com.zte.weather, com.zte.zdmdaemon, ... (26 packages)
      - "cn.nubia."   # UAD: cn.nubia.accounts, cn.nubia.browser, cn.nubia.calendar.preset, cn.nubia.contacts, cn.nubia.deskclock.preset, cn.nubia.gallery3d, cn.nubia.launcher, cn.nubia.security2, cn.nubia.setupwizard, cn.nubia.thememanager, ... (85 packages)

  tcl:
    manufacturer_match: ["tcl", "alcatel"]
    brand_match: ["tcl", "alcatel"]
    strict_prefixes:
      - "com.tcl."   # UAD: com.tcl.android.launcher, com.tcl.camera, com.tcl.compass, com.tcl.faceunlock, com.tcl.fmradio, com.tcl.fota.system, com.tcl.screenrecorder, com.tcl.tct.filemanager, com.tcl.weather, ... (39 packages)
      - "com.tct."   # UAD: com.tct.android.browser, com.tct.calculator, com.tct.camera, com.tct.contacts.transfer, com.tct.dialer, com.tct.faceunlock, com.tct.music, com.tct.phone, com.tct.setupwizard, ... (71 packages)
      - "com.tclhz."   # UAD: com.tclhz.gallery, com.tclhz.gallery.a_overlay (2 packages)

  meizu:
    manufacturer_match: ["meizu"]
    brand_match: ["meizu"]
    strict_prefixes:
      - "com.meizu."   # UAD: com.meizu.account, com.meizu.assistant, com.meizu.battery, com.meizu.cloud, com.meizu.flyme.launcher, com.meizu.media.camera, com.meizu.mstore, com.meizu.safe, com.meizu.setup, com.meizu.voiceassist, ... (39 packages)
      - "com.flyme."   # UAD: com.flyme.aod, com.flyme.netadmin, com.flyme.systemuiex, com.flyme.systemuitools, com.flyme.telecom.usagedata.service (5 packages)

  hmd:
    # manufacturer_match strings are forward-looking: real Nokia/HMD phones
    # report "HMD Global" (with space) and match via brand_match below.
    manufacturer_match: ["hmd", "hmdglobal", "nokia"]
    brand_match: ["hmd", "hmdglobal", "nokia"]
    strict_prefixes:
      - "com.hmdglobal."   # UAD: com.hmdglobal.camera2, com.hmdglobal.datago, com.hmdglobal.datago.overlay.base, com.hmdglobal.datago.overlay.base.s600ww, com.hmdglobal.enterprise.api, com.hmdglobal.support (6 packages)

  blackview:
    manufacturer_match: ["blackview"]
    brand_match: ["blackview"]
    strict_prefixes:
      - "com.blackview."   # UAD: com.blackview.ai.doki, com.blackview.app.cloudfolder, com.blackview.appsedge, com.blackview.cplog, com.blackview.easytrans, com.blackview.filetrans, com.blackview.gamemode, com.blackview.launcher, com.blackview.note, com.blackview.searchcenter, com.blackview.weather, ... (20 packages)

  fairphone:
    manufacturer_match: ["fairphone"]
    brand_match: ["fairphone"]
    strict_prefixes:
      - "com.fairphone."   # UAD: com.fairphone.activator, com.fairphone.myfairphone (2 packages)

  wiko:
    manufacturer_match: ["wiko"]
    brand_match: ["wiko"]
    strict_prefixes:
      - "com.wiko."   # UAD: com.wiko.packageinstaller, com.wiko.services (2 packages)

  # US carrier-branded builds: these prefixes apply only when the build
  # brand matches the carrier, typically on carrier-branded phones.
  # NOTE: com.ironsrc.aura.* is intentionally EXCLUDED — IronSource Aura
  # silently installs sponsored apps and should be flagged as invasive
  # bloatware regardless of carrier build.
  us_carrier_tmobile:
    manufacturer_match: []
    brand_match: ["tmobile"]
    strict_prefixes:
      - "com.tmobile."
      - "com.dti."
      - "com.digitalturbine."

  us_carrier_sprint:
    manufacturer_match: []
    brand_match: ["sprint"]
    strict_prefixes:
      - "com.sprint."

  us_carrier_att:
    manufacturer_match: []
    brand_match: ["att"]
    strict_prefixes:
      - "com.att."

  us_carrier_verizon:
    manufacturer_match: []
    brand_match: ["vzw", "verizon"]
    strict_prefixes:
      - "com.vzw."
      - "com.verizon."
