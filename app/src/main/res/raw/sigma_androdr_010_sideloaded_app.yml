title: App installed from untrusted source
id: androdr-010
status: production
description: App was not installed via a trusted app store.
author: AndroDR
date: 2026/03/27
tags:
    - attack.t1476
logsource:
    product: androdr
    service: app_scanner
detection:
    selection:
        is_system_app: false
        from_trusted_store: false
        is_known_oem_app: false
    filter_known_good:
        package_name|ioc_lookup: known_good_app_db
    # WebAPK exemption (#296/#311): PWAs minted by Google's WebAPK service
    # have per-device randomized package names AND per-app leaf signing
    # certs, so neither a package allowlist nor a fixed cert list can cover
    # them (the #296 cert list only ever matched the device it was sampled
    # on). The emitter exposes only the leaf cert today, so trust is
    # anchored on the system-attested install channel instead: Chrome hands
    # minted WebAPKs to Play services for install, and a sideloaded fake can
    # never acquire gms/chrome as its RECORDED installer (adb/self-installs
    # record null or the installing app itself). Prefix-gated, so this does
    # NOT make Chrome a trusted installer generally (#284 rationale intact).
    # Play-attributed WebAPKs (older Android) are already exempt via
    # from_trusted_store. The unforgeable anchor — any-signer equals the
    # constant Chrome WebAPK CA cert — lands with the cert_hashes emitter
    # in 0.9.0.617+ (#311).
    filter_verified_webapk:
        package_name|startswith: "org.chromium.webapk."
        installer:
            - "com.google.android.gms"
            - "com.android.chrome"
    condition: selection and not filter_known_good and not filter_verified_webapk
level: medium
category: incident
display:
    category: app_risk
    icon: download
    triggered_title: "Sideloaded Application"
    evidence_type: none
    guidance: "REVIEW -- sideloaded app with elevated permissions; verify intentional"
remediation:
    - "This app was not installed from a trusted app store. Verify you intended to install it."
implies_flags:
    - sideloaded
