title: App installed from untrusted source
id: androdr-010
status: production
description: App was not installed via a trusted app store.
author: AndroDR
date: 2026/03/27
tags:
    - attack.t1476
logsource:
    product: androdr
    service: app_scanner
detection:
    selection:
        is_system_app: false
        is_known_oem_app: false
    store_installed:
        installer|ioc_lookup: trusted_installer_db
    filter_known_good:
        package_name|ioc_lookup: known_good_app_db
    # Chrome-minted WebAPKs (org.chromium.webapk.*) are deliberately NOT
    # exempted here (reverses #296/#311). Rationale:
    #   1. Minted WebAPKs are a real threat vector — Google's minting service
    #      is unauthenticated, so any site (incl. credential-phishing PWAs,
    #      e.g. the documented PKO Bank Polski WebAPK) ships as a genuine
    #      Google-signed WebAPK. "Minted" does not mean "benign", so a
    #      reviewable Sideloaded-Application finding is the correct posture.
    #   2. No WEBAPK-SPECIFIC exemption was achievable anyway: the minter
    #      uses per-app leaf signing certs (only the leaf is emitted; the
    #      constant CA co-signer is not), so a WebAPK cannot be singled out
    #      by signature. (This is distinct from the general store gate below,
    #      which keys on the installer via trusted_installer_db.)
    # WebAPKs installed via Play (com.android.vending, older Android) are
    # still exempt via the negated store_installed exemption above
    # (installer|ioc_lookup: trusted_installer_db, #136 Phase 2); the rest
    # correctly surface as REVIEW-level sideloads.
    condition: selection and not store_installed and not filter_known_good
level: medium
category: incident
display:
    category: app_risk
    icon: download
    triggered_title: "Sideloaded Application"
    evidence_type: none
    guidance: "REVIEW -- sideloaded app with elevated permissions; verify intentional"
remediation:
    - "This app was not installed from a trusted app store. Verify you intended to install it."
implies_flags:
    - sideloaded
