title: Sideloaded app registered for boot-completed broadcast
id: androdr-066
status: experimental
category: incident
description: >
    A sideloaded (non-store, non-OEM) app is registered to start automatically
    when the device boots. A boot receiver alone is ubiquitous in legitimate
    apps and carries near-zero signal — the original receiver_audit shape of
    this rule flagged six store-installed apps on a clean device (#331) — so
    this rule fires only when the persistence mechanism co-occurs with a
    sideload signal. Malware and stalkerware commonly register for
    BOOT_COMPLETED to survive reboots after being installed outside any store.
author: AndroDR (AI-generated)
date: 2026/04/02
references:
    - https://attack.mitre.org/techniques/T1624/
    - https://github.com/yasirhamza/AndroDR/issues/331
tags:
    - attack.t1624
logsource:
    product: androdr
    service: app_scanner
detection:
    # FLEET SAFETY (#331): has_boot_receiver is emitted only by app builds
    # after #331, and it appears here in a POSITIVE selection — on older
    # builds the missing field evaluates false and the rule is simply silent,
    # which is the intended fleet-wide off-switch for the old noisy shape.
    # Never move this field into a negated filter until the fleet floor
    # covers the emitter.
    # is_known_oem_app is deliberately absent: it is a judgment-kind field and
    # the #136 emitter contract forbids new rule references. OEM preloads are
    # exempt via filter_known_good below (the known-good DB classifies OEM and
    # partner preloads); an OEM-prefixed app that is neither system, store-
    # installed, nor DB-known firing at level low is intended (cf. #328
    # prefix-squatting).
    selection:
        has_boot_receiver: true
        is_system_app: false
    # #136 Phase 2 store gate: the trusted-store exemption keys on the
    # installer via trusted_installer_db (fail-closed ioc_lookup), not the
    # from_trusted_store boolean — same shape as androdr-010.
    store_installed:
        installer|ioc_lookup: trusted_installer_db
    filter_known_good:
        package_name|ioc_lookup: known_good_app_db
    condition: selection and not store_installed and not filter_known_good
level: low
display:
    category: app_risk
    icon: restart_alt
    triggered_title: "Boot Persistence"
    evidence_type: none
remediation:
    - "This app was installed from outside a trusted store and starts automatically when your phone boots. If you did not install it intentionally, consider uninstalling it from Settings > Apps."
