title: DNS query to known C2 domain
id: androdr-003
status: production
description: "DNS query matched a domain on the threat list: a malware or spyware command-and-control server, a data-broker SDK endpoint, or a residential-proxy SDK endpoint. The matched entry names which."
author: AndroDR
date: 2026/03/27
tags:
    - attack.t1437
logsource:
    product: androdr
    service: dns_monitor
detection:
    selection:
        domain|ioc_lookup: domain_ioc_db
    condition: selection
level: critical
category: incident
display:
    category: app_risk
    icon: warning
    triggered_title: "Malicious Domain"
    evidence_type: ioc_match
    guidance: "INVESTIGATE -- device contacted a threat-list domain; the matched entry names the threat"
remediation:
    - "This device looked up a domain on the threat list. The finding names the threat family it belongs to."
    - "Malware, spyware or stalkerware: an app on this device may be controlled by an attacker. Find the app that made the lookup and remove it."
    - "Residential-proxy SDK (for example Bright SDK): an app is using this device's internet connection to carry other people's traffic. Uninstall that app; blocking the domain alone does not stop the SDK."
    - "Data-broker SDK: an app is sending information about this device to a data broker. Uninstall that app or revoke its location permission."
