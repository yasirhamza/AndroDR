    expected_patterns:
      - "Security Patch Outdated"

  - id: cve_predator_campaign
    track: 4
    risk: high
    technique: T1404
    tactic: initial-access
    description: "Predator campaign rule fires for matching unpatched CVEs"
    source: adb_inject
    inject: []
    # Patch-gated like cve_campaign_pegasus. In a --load run with a Predator
    # detection (mercenary_predator_artifacts, mercenary_dns_c2) the row is DETECTED,
    # which outranks EXPOSED, so run this one without them.
    expected_patterns:
      - "[!!]  Predator: EXPOSED --"
      - "!~Predator: DETECTED -- .*CVEs linked to"

  - id: cve_graphite_campaign
    track: 4
    risk: high
    technique: T1404
    tactic: initial-access
    description: "Graphite campaign rule fires for matching unpatched CVEs"
    source: adb_inject
