  - id: mercenary_file_artifacts
    track: 3
    risk: medium
    technique: T1533
    tactic: collection
    description: "Known spyware file paths injected via ADB"
    source: adb_inject
    inject:
      - type: file
        adb_cmd: "shell touch /data/local/tmp/.raptor"
        cleanup: "shell rm -f /data/local/tmp/.raptor"
      - type: file
        adb_cmd: "shell touch /data/local/tmp/.stat"
        cleanup: "shell rm -f /data/local/tmp/.stat"
    attack: [T1533]
    # /data/local/tmp is rwxrwx--x: apps cannot list it but can look up an exact
    # name, which the scanner does since #387. Full patterns, including the
    # "never clear" guards, are in fixtures/expected/mercenary_file_artifacts.patterns.
    expected_patterns:
      - "Spyware artifact: /data/local/tmp/.raptor"
      - "Spyware artifact: /data/local/tmp/.stat"

  - id: mercenary_predator_artifacts
    track: 3
    risk: medium
    technique: T1533
    tactic: collection
    description: "Cytrox Predator drop paths injected via ADB (androdr-108)"
    source: adb_inject
    inject:
      - type: file
        adb_cmd: "shell mkdir -p /data/local/tmp/wd && chmod 777 /data/local/tmp/wd && touch /data/local/tmp/wd/fs.db"
        cleanup: "shell rm -rf /data/local/tmp/wd"
      - type: file
        adb_cmd: "shell touch /data/local/tmp/dropbox"
        cleanup: "shell rm -f /data/local/tmp/dropbox"
    attack: [T1533]
    expected_patterns:
      - "Predator artifact: /data/local/tmp/wd"
      - "Predator artifact: /data/local/tmp/dropbox"
      - "[!!]  Predator: DETECTED -- Predator artifact: /data/local/tmp/"

  - id: mercenary_dns_c2
    track: 3
    risk: medium
    technique: T1437
    tactic: command-and-control
    # cdn-tp2.xyz was invented, 10.0.0.2 is not the tunnel's DNS address, and
    # the emulator image has no nslookup, so this scenario never ran. ping
    # resolves through netd like an app does (attributed to com.android.shell).
    # 2y4nothing.xyz is in MVT's Intellexa Predator bundle (loaded on-device by
    # MvtIndicatorsFeed) and nowhere in the bundled blocklist. Needs the VPN on.
    description: "DNS query to known Predator C2 domain (MVT Intellexa Predator)"
    source: adb_inject
    inject:
      - type: dns_query
        adb_cmd: "shell ping -c1 -W2 2y4nothing.xyz"
    attack: [T1437]
    expected_patterns:
      - "~\\[MATCHED\\].*2y4nothing\\.xyz"
      - "2y4nothing.xyz -> Predator Spyware Indicators of Compromise"
      - "[!!]  Predator: DETECTED -- domain 2y4nothing.xyz (Predator Spyware Indicators of Compromise),"

