  # ── Track 4: CVE vulnerability detection (NEW — issue #25) ────────────
  - id: cve_unpatched_detection
    track: 4
    risk: high
    technique: T1404
    tactic: initial-access
    description: "Device with stale patch level triggers CVE finding with evidence"
    source: adb_inject
    inject: []
    # No injection needed — relies on the device's actual patch level being behind
    # the CISA KEV entries. On a fresh emulator with no CVE DB refresh, the safe
    # finding ("No Known Exploited CVEs") proves the engine runs.
    attack: [T1404]
    expected_patterns:
      - "CVEs"
      - "DEVICE CHECKS"

  - id: cve_campaign_pegasus
    track: 4
    risk: high
    technique: T1404
    tactic: initial-access
    description: "Pegasus campaign rule fires when device has matching unpatched CVEs"
    source: adb_inject
    inject: []
    # Depends on device patch level being old enough that Pegasus CVEs are unpatched.
    # Rule CVEs (Android NSO set since #319): CVE-2019-2215 (KEV 2021-11-03) and
    # CVE-2023-7024 (KEV 2024-01-02) — an emulator patched after 2024-01-02 shows
    # "[OK]  Pegasus: not detected" and FAILS this scenario: a patch-gated true
    # positive needs an old-patch-level image. Since Plan B (B7) the report lists
    # every campaign, so a bare "Pegasus" pattern was vacuous; the patch-level rule
    # must read EXPOSED and never DETECTED (owner decision Q9-3).
    attack: [T1404]
    expected_patterns:
      - "[!!]  Pegasus: EXPOSED --"
      - "!~Pegasus: DETECTED -- .*CVEs linked to"

  - id: cve_settings_display
    track: 4
    risk: high
    technique: T1404
    tactic: initial-access
    description: "Settings threat DB shows CVE count after update"
    source: adb_inject
    inject:
      - type: trigger_update
        adb_cmd: "shell am broadcast -a com.androdr.ACTION_SCAN -n com.androdr.debug/com.androdr.debug.ScanBroadcastReceiver"
    attack: [T1404]
    expected_patterns:
      # After a scan, the report header shows patch level
      - "Patch"
      - "OVERALL RISK"

  - id: cve_stale_patch
    track: 4
    risk: high
    technique: T1404
    tactic: initial-access
    description: "Device with patch level >90 days old triggers stale finding"
    source: adb_inject
